        .step-main { flex: 1; }

        .nav-step:hover { background: #f1f2f6; border-color: #bdc3c7;}
        .nav-step.active { background: #3498db; color: white; border-color: #2980b9; font-weight: bold;}
        .nav-step.visited { background: #2ecc71; color: white; border-color: #27ae60; opacity: 0.85;}

        .btn-back { background-color: #e67e22; color: white; border: none; padding: 10px 18px; font-size: 1.05rem; font-weight: bold; border-radius: 6px; cursor: pointer; margin-bottom: 20px; transition: 0.2s;}
        .btn-back:hover { background-color: #d35400;}

        .instruction { font-size: 1.3rem; font-weight: bold; margin: 0 0 15px 0; color: #d35400; border-left: 5px solid #d35400; padding-left: 12px; line-height: 1.5;}
        .step-details { background-color: #fff3cd; color: #856404; padding: 15px; border-left: 5px solid #ffeeba; border-radius: 4px; margin-bottom: 20px; line-height: 1.6; font-size: 1.1rem; white-space: pre-wrap;}
        .step-image { max-width: 100%; max-height: 450px; border-radius: 8px; border: 1px solid #ddd; display: block; object-fit: contain;}
        .doc-link { display: inline-flex; background-color: #8e44ad; color: white; padding: 10px 20px; border-radius: 5px; text-decoration: none; margin-bottom: 20px; font-weight: bold;}
        .options-container { display: flex; gap: 15px; flex-wrap: wrap; margin-top: 20px; border-top: 1px dashed #ccc; padding-top: 20px;}
        .option-btn { background-color: #2ecc71; color: white; border: none; padding: 12px 25px; font-size: 1.1rem; font-weight: bold; border-radius: 6px; cursor: pointer;}
        .option-btn.btn-escalate { background-color: #e74c3c; }
        .reset-btn { background-color: #95a5a6; color: white; border: none; padding: 10px 18px; border-radius: 4px; cursor: pointer; margin-top: 30px; float: right; font-size: 1rem;}
        .owner-card { background: #fdf2e9; border: 2px dashed #e67e22; padding: 20px; border-radius: 8px; font-size: 1.4rem; line-height: 2;}

    <script type="application/json" id="data-indexMapping">{"BM405":"G-LINE","BM407":"G-LINE","BM408":"G-LINE"}</script>
    
    <script>
        const database = JSON.parse(document.getElementById('data-database').textContent);
        const indexMapping = JSON.parse(document.getElementById('data-indexMapping').textContent);
        
        let currentAlarmId = null; let stepHistory = []; let visitedSteps = new Set(); let currentStepId = null;
        const appContent = document.getElementById('app-content'); const headerTitle = document.getElementById('header-title');

        function renderHome() {
            currentAlarmId = null; stepHistory = []; visitedSteps = new Set(); currentStepId = null;
            headerTitle.innerHTML = "機台修機指引系統<br><span style='font-size: 1.2rem; color: #7f8c8d;'>(Machine Troubleshooting Guide)</span>";
            
            let machines = new Set(); Object.values(database).forEach(i => { if(i.machine) machines.add(i.machine); });
            let html = '<div style="display:flex; flex-direction:column; gap:15px; max-width:460px; margin:0 auto 25px auto; text-align:left; background:#f8fafc; padding:20px; border-radius:8px; border:1px solid #e2e8f0;">';
            
            html += '<div><label style="font-weight:bold; display:block; margin-bottom:6px; color:#2c3e50;">🔍 輸入或選取機台編號 (Input or select EQP ID)：</label>';
            html += '<input type="text" id="eqpInput" list="eqpDatalist" class="select-box" style="max-width:100%; width:100%; margin-bottom:0; box-sizing: border-box;" placeholder="手動輸入或選擇 (e.g. BM101)" oninput="onEqpInputChange(this.value)">';
            html += '<datalist id="eqpDatalist">';
            Object.keys(indexMapping).sort().forEach(eqp => { html += `<option value="${eqp}">型號 (Model): ${indexMapping[eqp]}</option>`; });
            html += '</datalist></div>';
            
            html += '<div><label style="font-weight:bold; display:block; margin-bottom:6px; color:#2c3e50;">⚙️ 生產機型對應 (Target Model)：</label>';
            html += '<select id="mSelect" class="select-box" style="max-width:100%; width:100%; margin-bottom:0;" onchange="onMachineSelectChange(this.value)">';
            html += '<option value="">-- 請選擇生產機型 (Select Target Model) --</option>';
            Array.from(machines).sort().forEach(m => { html += `<option value="${m}">${m}</option>`; });
            html += '</select></div></div><div id="alarm-list-wrapper"></div>';
            appContent.innerHTML = html;
        }

        function onEqpInputChange(val) {
            const mSelect = document.getElementById('mSelect'); const cleanVal = val.trim().toUpperCase();
            const matchedKey = Object.keys(indexMapping).find(k => k.toUpperCase() === cleanVal);
            if (matchedKey && indexMapping[matchedKey]) { mSelect.value = indexMapping[matchedKey]; renderAlarmList(indexMapping[matchedKey]); } 
            else { if (!val) { mSelect.value = ""; document.getElementById('alarm-list-wrapper').innerHTML = ''; } }
        }

        function onMachineSelectChange(machId) { document.getElementById('eqpInput').value = ""; renderAlarmList(machId); }

        function renderAlarmList(mach) {
            const wrapper = document.getElementById('alarm-list-wrapper');
            if(!mach) { wrapper.innerHTML = ''; return; }
            const filteredKeys = Object.keys(database).filter(k => database[k].machine === mach)
                .sort((a, b) => database[a].alarmId.localeCompare(database[b].alarmId, undefined, { numeric: true, sensitivity: 'base' }));
            
            if(filteredKeys.length === 0) { wrapper.innerHTML = '<p style="color:#e74c3c; font-weight:bold; text-align:center;">此機型目前無任何代碼指引設定。<br>(No alarm guide setup for this model yet.)</p>'; return; }

            let html = '<div class="alarm-list">';
            filteredKeys.forEach(k => {
                const item = database[k];
                const btnClass = item.isEmptyTemplate ? "alarm-btn incomplete" : "alarm-btn";
                const prefix = item.isEmptyTemplate ? "⚠️ [尚未建檔 / Not created]" : "🚨";
                html += `<button class="${btnClass}" onclick="startTroubleshooting('${k}')">${prefix} <b>${item.alarmId}</b> : ${item.name}</button>`;
            });
            html += '</div>'; wrapper.innerHTML = html;
        }

        function startTroubleshooting(dbKey) {
            currentAlarmId = dbKey;
            headerTitle.innerHTML = `[${database[dbKey].machine}] 檢修中 (Troubleshooting)：<br>${database[dbKey].alarmId} - ${database[dbKey].name}`;
            appContent.innerHTML = `<div class="app-layout"><div class="step-sidebar" id="step-sidebar"></div><div class="step-main" id="step-main"></div></div>`;
            renderStep(database[dbKey].firstStepId);
        }

        function renderSidebar() {
            const sidebar = document.getElementById('step-sidebar'); if (!sidebar || !database[currentAlarmId]) return;
            const steps = database[currentAlarmId].steps;
            let html = '<h3>📍 步驟導航列 (Step Navigation)</h3>';
            Object.keys(steps).forEach(sId => {
                let classes = 'nav-step'; let icon = '🔹';
                if (sId === currentStepId) { classes += ' active'; icon = '👉'; }
                else if (visitedSteps.has(sId)) { classes += ' visited'; icon = '✅'; }
                
                let preview = steps[sId].instruction;
                if (preview.length > 50) preview = preview.substring(0, 50) + '...';
                
                html += `<div class="${classes}" onclick="jumpToStep('${sId}')">${icon} <b>${sId}</b><br><span style="font-size:0.85rem; margin-left:22px; display:block; color:inherit;">${preview}</span></div>`;
            });
            sidebar.innerHTML = html;
        }

        function jumpToStep(stepId) { if (stepId !== currentStepId) renderStep(stepId, false); }
        function goBack() { if (stepHistory.length > 0) { const prevStep = stepHistory.pop(); renderStep(prevStep, true); } }

        function renderStep(stepId, isBack = false) {
            const mainContent = document.getElementById('step-main');
            if (!isBack && currentStepId && currentStepId !== 'escalate' && currentStepId !== 'resolved') { stepHistory.push(currentStepId); }
            
            currentStepId = stepId;
            if (stepId !== 'escalate' && stepId !== 'resolved') visitedSteps.add(stepId);
            renderSidebar(); 

            let backHtml = stepHistory.length > 0 ? `<button class="btn-back" onclick="goBack()">⬅️ 返回上一步驟 (Back)</button>` : '';

            if (stepId === "escalate" || stepId === "resolved") {
                const isResolved = stepId === "resolved"; const item = database[currentAlarmId];
                mainContent.innerHTML = backHtml + `
                    <div style="color:${isResolved ? '#2ecc71' : '#c0392b'}; font-size:1.6rem; font-weight:bold; margin-bottom:20px; line-height: 1.4;">
                        ${isResolved ? '✅ 恭喜！此異常已成功排除。<br><span style="font-size: 1.2rem;">(Congratulations! The error is resolved.)</span>' : '⚠️ 流程已達極限，請通報值班人員：<br><span style="font-size: 1.2rem;">(End of process. Please escalate to shift engineer:)</span>'}
                    </div>
                    ${!isResolved ? `<div class="owner-card">👤 ${item.ownerName || '工程師 (Engineer)'}<br>📞 ${item.ownerPhone || '未填寫 (Not provided)'}</div>` : ''}
                    <button class="reset-btn" onclick="renderHome()" style="float:none; margin-top:20px;">回首頁 (Home)</button>
                `; return;
            }

            const stepData = database[currentAlarmId].steps[stepId];
            if (!stepData) return mainContent.innerHTML = backHtml + '<h2>找不到指定步驟。(Step not found.)</h2><button class="reset-btn" onclick="renderHome()">回首頁 (Home)</button>';

            let html = backHtml + `<div class="instruction">📍 動作 (Action)：<br>${stepData.instruction}</div>`;
            if (stepData.details) html += `<div class="step-details">${stepData.details}</div>`;
            
            // 多圖片排版顯示 (相容舊版單圖)
            if (stepData.images && stepData.images.length > 0) {
                html += '<div style="display:flex; flex-wrap:wrap; gap:15px; margin-bottom:20px;">';
                stepData.images.forEach(imgB64 => { html += `<img src="${imgB64}" class="step-image" onerror="this.style.display='none';">`; });
                html += '</div>';
            } else if (stepData.imageUrl) {
                html += `<div style="margin-bottom:20px;"><img src="${stepData.imageUrl}" class="step-image" onerror="this.style.display='none';"></div>`;
            }
            
            if (stepData.linkUrl) html += `<a href="${stepData.linkUrl}" target="_blank" class="doc-link">📄 開啟 SOP 參考文件 (Open SOP Reference Doc)</a><br>`;

            html += '<div class="options-container">';
            if (stepData.options) {
                stepData.options.forEach(opt => {
                    if (opt.nextStepId === 'resolved') html += `<button class="option-btn" style="background-color: #3498db;" onclick="renderStep('resolved')">${opt.label}</button>`;
                    else if (opt.nextStepId === 'escalate') html += `<button class="option-btn btn-escalate" onclick="renderStep('escalate')">${opt.label}</button>`;
                    else html += `<button class="option-btn" onclick="renderStep('${opt.nextStepId}')">${opt.label}</button>`;
                });
            }
            html += '</div><button class="reset-btn" onclick="renderHome()">中止排查，回首頁 (Abort & Home)</button>';
            mainContent.innerHTML = html;
        }
        window.onload = renderHome;
    </script>
